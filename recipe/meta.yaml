{% set name = "z3prover" %}
{% set version = "4.15.4" %}
{% set lib = "" if unix else "Library/" %}
{% set version_with_py_micro = "4.15.4.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/Z3Prover/z3/archive/refs/tags/z3-{{ version }}.tar.gz
  sha256: dae526252cb0585c8c863292ebec84cace4901a014b190a73f14087dd08d252b
  patches:
    # backport https://github.com/Z3Prover/z3/pull/8088
    - patches/0001-BLD-Add-CMake-option-to-build-Python-bindings-withou.patch
    - patches/0002-avoid-custom-re-build-commands-and-data-files.patch

build:
  number: 0

requirements:
  host:
    - pip
    - python
    - cmake
    - ninja-base
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}
  run:
    - python

outputs:
  - name: libz3
    script: build_lib.sh   # [unix]
    script: build_lib.bat  # [win]
    requirements:
      build:
        - python
        - {{ stdlib('c') }}
        - {{ compiler('cxx') }}
        - cmake
        - ninja-base
      host:
        - python
        - llvm-openmp  # [osx]
        - libgomp  # [linux]
        - vcomp14  # [win and x86_64]
      run_constraints:
        - z3prover =={{ version }}
    test:
      commands:
        - z3 --help
        # libraries
        - lib/libz3.so  # [linux]
        - lib/libz3.so.${{ version }}*  # [linux]
        - lib/libz3.dylib  # [osx]
        - lib/libz3.${{ version }}*.dylib  # [osx]
        - Library/bin/libz3.dll  # [win]
        - Library/lib/libz3.lib  # [win]
        # binaries
        - bin/z3  # [unix]
        - Library/bin/z3.exe  # [win]
        # headers
        - {{ lib }}include/z3_algebraic.h
        - {{ lib }}include/z3_api.h
        - {{ lib }}include/z3_ast_containers.h
        - {{ lib }}include/z3_fixedpoint.h
        - {{ lib }}include/z3_fpa.h
        - {{ lib }}include/z3.h
        - {{ lib }}include/z3++.h
        - {{ lib }}include/z3_macros.h
        - {{ lib }}include/z3_optimization.h
        - {{ lib }}include/z3_polynomial.h
        - {{ lib }}include/z3_rcf.h
        - {{ lib }}include/z3_v1.h
        - {{ lib }}include/z3_spacer.h
        - {{ lib }}include/z3_version.h
        # cmake & pkgconfig metadata
        - {{ lib }}lib/cmake/z3/Z3Targets.cmake
        - {{ lib }}lib/cmake/z3/Z3Targets-release.cmake
        - {{ lib }}lib/cmake/z3/Z3Config.cmake
        - {{ lib }}lib/cmake/z3/Z3ConfigVersion.cmake
        - {{ lib }}lib/pkgconfig/z3.pc
        
  - name: z3-solver
    script: build_py.sh   # [unix]
    script: build_py.bat  # [win]
    requirements:
      build:
        - python
        - {{ stdlib('c') }}
        - {{ compiler('cxx') }}
        - cmake
        - ninja-base
      host:
        - pip
        - python
        - setuptools
        - llvm-openmp  # [osx]
        - libgomp  # [linux]
        - vcomp14  # [win and x86_64]
        - {{ pin_subpackage("libz3", exact=True) }}
      run:
        - python
        - {{ pin_subpackage("libz3", exact=True) }}
    test:
      files:
        - test_z3.py
      imports:
        - z3
      commands:
        - pip check
        - pytest -vv --tb=long --color=yes
      requires:
        - pip
        - pytest
  # compatibility for previous name of library
  - name: z3prover
    build:
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage("libz3", exact=True) }}
    test:
      commands:
        - z3 --help

about:
  license: MIT
  license_file: LICENSE.txt
  summary: The Z3 Theorem Prover
  homepage: https://github.com/Z3Prover/z3
  repository: https://github.com/Z3Prover/z3
  documentation: https://github.com/Z3Prover/z3/wiki#background

extra:
  recipe-maintainers:
    - martin-g
    - h-vetinari
